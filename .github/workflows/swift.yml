name: swift

on:
  # Manual-only: run via `gh workflow run swift` or the Actions tab when you
  # want a fresh check — Actions minutes are a budget, not a trigger.
  workflow_dispatch:

jobs:
  build-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
